name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-player-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require the current integrated main commit for release tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the integration branch.' }
          $main = git rev-parse refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the integration commit.' }
          if ($env:GITHUB_SHA -ne $main) { throw 'Release tags must identify the current integrated main commit.' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Install development dependencies
        working-directory: native
        run: npm ci
      - name: Unit tests and lint
        working-directory: native
        run: |
          npm run test:unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
      - name: Check PowerShell and dependency resolution
        shell: powershell
        run: .\test\packaging.ps1 -NodePath (Get-Command node.exe).Source
      - name: Check history filters and bounded selection previews
        shell: powershell
        run: .\test\history-filters.ps1
      - name: Check library helper deadlines and lifecycle without showing windows
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\openai-settings.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\capture-helper.ps1 -NodePath (Get-Command node.exe).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\library-helper-lifecycle.ps1 -NodePath (Get-Command node.exe).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check responsive overlay layout without showing windows
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\overlay-layout.ps1
      - name: Check isolated agent worktree ownership and handoffs
        shell: powershell
        run: .\test\agent-worktrees.ps1
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = (Get-Content .\native\package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version do not match.' }
      - name: Provision signed installer compiler
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer -TimeoutSec 180
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Pyrsys B\.V\.') { throw 'Unexpected compiler installer signature.' }
          $directory = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',('/DIR="' + $directory + '"')) -PassThru
          if (-not $process.WaitForExit(120000)) { throw 'Compiler installation timed out.' }
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed.' }
          "INNO_COMPILER=$directory\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer
        shell: powershell
        run: .\packaging\Build-Windows.ps1 -InnoCompiler $env:INNO_COMPILER
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/VSCodeDemoPlayer-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "VS Code Demo Player $GITHUB_REF_NAME" --generate-notes --notes "Version0.2.16 fixes AI generation rejecting an entire selection because its combined sources exceeded1MiB, even when individual exchanges were short. Long sources are now automatically summarized in bounded64000-character parts, then their ordered summaries are combined into one reviewed overlay summary. No original source text is silently truncated. Short sources still use one request each, without a whole-selection size cap beyond existing recording limits. Consent explicitly covers additional part/combination requests and API charges; progress identifies the phase and part. Every request retains its90-second limit, explicit cancellation, no tools, store false and no automatic API retries. A part failure/cancellation produces no partially saved batch; review/save, both saved/total counters, scope isolation and existing summaries remain intact. Unicode input split across helper pipe buffers is preserved. Windows transient summary-save sharing violations get a short bounded filesystem-only retry; persistent failures remain explicit and preserve original bytes. Settings/key encryption/model selection and separate OpenAI API billing remain as in0.2.15. Verification uses fabricated recordings and synthetic HTTP responses, not a real OpenAI key or paid request; actual account/model readiness remains unverified. OpenAI retention rules still apply and canceled requests can incur charges. Playback never calls AI. Existing updater-enabled users can choose Check for updates and explicitly consent to installation; startup checks never install automatically. The installed app is not silently replaced. Windows x64 per-user installer with bundled Node.js; compatible desktop VS Code required. Unsigned; keys, private recordings, profiles and evidence excluded." dist/VSCodeDemoPlayer-Setup.exe dist/SHA256SUMS.txt
