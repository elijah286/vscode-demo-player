name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-player-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require the current integrated main commit for release tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the integration branch.' }
          $main = git rev-parse refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the integration commit.' }
          if ($env:GITHUB_SHA -ne $main) { throw 'Release tags must identify the current integrated main commit.' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Install development dependencies
        working-directory: native
        run: npm ci
      - name: Unit tests and lint
        working-directory: native
        run: |
          npm run test:unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
      - name: Check PowerShell and dependency resolution
        shell: powershell
        run: .\test\packaging.ps1 -NodePath (Get-Command node.exe).Source
      - name: Check history filters and bounded selection previews
        shell: powershell
        run: .\test\history-filters.ps1
      - name: Check library helper deadlines and lifecycle without showing windows
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\capture-helper.ps1 -NodePath (Get-Command node.exe).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\library-helper-lifecycle.ps1 -NodePath (Get-Command node.exe).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check responsive overlay layout without showing windows
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\overlay-layout.ps1
      - name: Check isolated agent worktree ownership and handoffs
        shell: powershell
        run: .\test\agent-worktrees.ps1
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = (Get-Content .\native\package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version do not match.' }
      - name: Provision signed installer compiler
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer -TimeoutSec 180
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Pyrsys B\.V\.') { throw 'Unexpected compiler installer signature.' }
          $directory = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',('/DIR="' + $directory + '"')) -PassThru
          if (-not $process.WaitForExit(120000)) { throw 'Compiler installation timed out.' }
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed.' }
          "INNO_COMPILER=$directory\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer
        shell: powershell
        run: .\packaging\Build-Windows.ps1 -InnoCompiler $env:INNO_COMPILER
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/VSCodeDemoPlayer-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "VS Code Demo Player $GITHUB_REF_NAME" --generate-notes --notes "Frozen release-0.2.12 batch integrates summary-provider-recovery1ae4935, output-summary-conversation010a779 and response-ai-summaries-explicit-button1737352 on v0.2.11. Both picker tabs now offer Generate AI summaries of responses, with a matching Command Palette action. Response-only generation uses supported recorded output and concise tool status, never user prompts, and reuses explicit consent, model selection and editable batch review. Existing summaries and full original chat answers are preserved. The default-off Show summary of output checkbox enables the delivered You/AI conversation overlay with a fixed cumulative timer and missing-output guidance. Manual input/output summary editing, clear-all confirmation and metadata export/import are retained. A dedicated isolated authoring profile preserves provider sign-in/setup; actionable provider discovery/retry and queued selections survive window reload. Playback never calls AI. Fresh synthetic native/WPF acceptance covers the response button, review and output overlay; live external AI and replacement of the user's installed app were not performed. Existing updater-enabled users can choose Check for updates and explicitly consent to installation; startup checks never install automatically. Version0.1.0 needs a one-time manual installer bootstrap. Windows x64 per-user installer with bundled Node.js; compatible desktop VS Code required. Unsigned; private recordings, profiles and generated evidence are not shipped." dist/VSCodeDemoPlayer-Setup.exe dist/SHA256SUMS.txt
