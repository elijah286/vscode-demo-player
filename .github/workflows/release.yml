name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-player-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require the current integrated main commit for release tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the integration branch.' }
          $main = git rev-parse refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the integration commit.' }
          if ($env:GITHUB_SHA -ne $main) { throw 'Release tags must identify the current integrated main commit.' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Install development dependencies
        working-directory: native
        run: npm ci
      - name: Unit tests and lint
        working-directory: native
        run: |
          npm run test:unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
      - name: Check PowerShell and dependency resolution
        shell: powershell
        run: .\test\packaging.ps1 -NodePath (Get-Command node.exe).Source
      - name: Check history filters and bounded selection previews
        shell: powershell
        run: .\test\history-filters.ps1
      - name: Check library helper deadlines and lifecycle without showing windows
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\openai-settings.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\capture-helper.ps1 -NodePath (Get-Command node.exe).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\library-helper-lifecycle.ps1 -NodePath (Get-Command node.exe).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check responsive overlay layout without showing windows
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\overlay-layout.ps1
      - name: Check exchange selection without showing windows
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\exchange-selection.ps1
      - name: Check cohesive dialog layout and bounded UI work
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\dialog-theme.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\dialog-performance.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check compact native shell and persistent library
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\compact-shell.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\test\persistent-library.ps1 -NodePath (Get-Command node.exe).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check isolated agent worktree ownership and handoffs
        shell: powershell
        run: .\test\agent-worktrees.ps1
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = (Get-Content .\native\package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version do not match.' }
      - name: Provision signed installer compiler
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer -TimeoutSec 180
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Pyrsys B\.V\.') { throw 'Unexpected compiler installer signature.' }
          $directory = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',('/DIR="' + $directory + '"')) -PassThru
          if (-not $process.WaitForExit(120000)) { throw 'Compiler installation timed out.' }
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed.' }
          "INNO_COMPILER=$directory\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer
        shell: powershell
        run: .\packaging\Build-Windows.ps1 -InnoCompiler $env:INNO_COMPILER
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/VSCodeDemoPlayer-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "VibeReplay (VS Code Demo Player) $GITHUB_REF_NAME" --generate-notes --notes "Version 0.2.32 integrates cohesive-dialog-experience8c6703e9f3d5bd918ac919af4bae4e72c4cee8ca and summary-generation-critical6b6e30749c23dbce2f557725400f75b18959a0cc onto0.2.31. Secondary dialogs match the compact graphite/mint controller, with accessible high-contrast fallback, working-area constraints, virtualized lists, coalesced search typing and batched bulk-selection counts. Completed AI drafts with unfinished wording or third-person narration use the existing shared four-request length/content correction budget instead of failing immediately. Failed/refused/incomplete provider requests are not retried. Source grounding, strict API bounds, measured full-pair fit, consent, explicit review/Save and cancellation remain mandatory. Corrections may be billed as explained before consent; cancellation cannot undo charges. Unsummarized input presentation keeps the full normalized original instead of clipping at300characters; large pairs require reviewed summaries. Output mode rejects missing included output summaries before launch, and disables itself with explicit recovery guidance if enabled on an incomplete open selection. Playback never requests paid AI. Complete SDK imports retain actual turn-end timestamps; old selections recover timing read-only from saved events, with missing/invalid/partial timing explicitly unavailable. Existing saved summaries are not silently rewritten. This is still the compiled C# WPF/Windows PowerShell5.1 compatibility host, not the unfinished.NET10 migration. No new runtime dependencies; DialogTheme.xaml is packaged. Stable launcher, installer identity/path, assets/checksums/update contract and library/key/settings remain compatible. In-flight work and rejected length-relaxation proposal excluded. Known limitations: unsigned Windows x64 installer, compatible desktop VS Code, no paid-provider fidelity certification or user-installed upgrade/restart test. Existing raw-reply playback above1MiB and updater issue#10 remain outside batch. No private recordings/keys/profiles/evidence shipped; publication does not replace the running app or discard drafts." dist/VSCodeDemoPlayer-Setup.exe dist/SHA256SUMS.txt
