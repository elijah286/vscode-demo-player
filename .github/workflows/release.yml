name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-player-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require the current integrated main commit for release tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the integration branch.' }
          $main = git rev-parse refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the integration commit.' }
          if ($env:GITHUB_SHA -ne $main) { throw 'Release tags must identify the current integrated main commit.' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Install development dependencies
        working-directory: native
        run: npm ci
      - name: Unit tests and lint
        working-directory: native
        run: |
          npm run test:unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
      - name: Check PowerShell and dependency resolution
        shell: powershell
        run: .\test\packaging.ps1 -NodePath (Get-Command node.exe).Source
      - name: Check history filters and bounded selection previews
        shell: powershell
        run: .\test\history-filters.ps1
      - name: Check isolated agent worktree ownership and handoffs
        shell: powershell
        run: .\test\agent-worktrees.ps1
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = (Get-Content .\native\package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version do not match.' }
      - name: Provision signed installer compiler
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer -TimeoutSec 180
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Pyrsys B\.V\.') { throw 'Unexpected compiler installer signature.' }
          $directory = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',('/DIR="' + $directory + '"')) -PassThru
          if (-not $process.WaitForExit(120000)) { throw 'Compiler installation timed out.' }
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed.' }
          "INNO_COMPILER=$directory\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer
        shell: powershell
        run: .\packaging\Build-Windows.ps1 -InnoCompiler $env:INNO_COMPILER
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/VSCodeDemoPlayer-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "VS Code Demo Player $GITHUB_REF_NAME" --generate-notes --notes "Frozen release-0.2.7 batch integrates 72b63d2, f29f114 and 6f24148 on the v0.2.6 baseline. Recorded code edits and saved activity now use collapsed read-only native activity entries instead of flooding assistant prose with raw payloads; expand them to inspect saved details. Prompt overlays can be resized and retain their chosen dimensions during the controller session. Edit reviewed per-exchange prompt summaries in Manage Demos, or use an isolated authoring window for optional consent-based AI suggestions with your own provider sign-in; playback never invokes AI and always types the original prompt. Includes registered parallel-worktree tooling for development only. The new prompt-summary authoring runtime is included; recordings and generated summaries are not shipped. Existing updater-enabled users can choose Check for updates and consent to installation; startup checks never install automatically. Version 0.1.0 needs a one-time manual installer bootstrap. Windows x64 per-user installer with bundled Node.js; compatible desktop VS Code required. Unsigned." dist/VSCodeDemoPlayer-Setup.exe dist/SHA256SUMS.txt
